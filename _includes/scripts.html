{% if site.google_analytics %}
<!-- Asynchronous Google Analytics snippet -->
<script>
  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

  ga('create', '{{ site.google_analytics }}', 'auto');  
  ga('require', 'linkid', 'linkid.js');
  ga('send', 'pageview');
</script>
{% endif %}

{% if page.comments != false %}{% include disqus_comments.html %}{% endif %}

{% if page.math %}
<!-- MathJax v3 is self-hosted and loaded ONLY on pages that declare math: true.
     The old theme pulled cdn.mathjax.org (retired in 2017) on every page: dead weight that
     blocked window.onload. 2.1MB belongs on the one post that has formulas, not on 78. -->
<script>window.MathJax = { tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] }, svg: { fontCache: 'global' } };</script>
<script src="{{ site.url }}/assets/js/vendor/mathjax-tex-svg.js" id="MathJax-script" defer></script>
{% endif %}
